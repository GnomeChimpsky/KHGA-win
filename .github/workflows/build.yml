name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            name: win64
          - arch: i686
            name: win32
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 g++-mingw-w64 ninja-build nasm zip

      - name: Cache FFmpeg build
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-${{ matrix.arch }}
          key: ffmpeg-n6.1.2-${{ matrix.arch }}-${{ hashFiles('desktop/scripts/build-ffmpeg.sh') }}

      - name: Build and package
        run: desktop/scripts/build-windows.sh ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: KHGWin-${{ matrix.name }}
          path: build/${{ matrix.name }}/stage/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: KHGWin-${{ matrix.name }}-debug
          path: build/${{ matrix.name }}/debug/KHGWin.exe
          if-no-files-found: error

  android:
    name: Android debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build
        run: ./gradlew --no-daemon :app:assembleDebug
