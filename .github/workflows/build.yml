name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            name: win64
          - arch: i686
            name: win32
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe for the build version

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64 g++-mingw-w64 ninja-build nasm zip

      - name: Cache FFmpeg build
        uses: actions/cache@v4
        with:
          path: build/ffmpeg-${{ matrix.arch }}
          key: ffmpeg-n6.1.2-${{ matrix.arch }}-${{ hashFiles('desktop/scripts/build-ffmpeg.sh', 'desktop/patches/ffmpeg-*.patch') }}

      - name: Build and package
        run: desktop/scripts/build-windows.sh ${{ matrix.arch }}

      # The release zip as it is published: the KHGWin folder (no game data) with README and licences.
      - uses: actions/upload-artifact@v4
        with:
          name: KHGWin-${{ matrix.name }}
          path: build/${{ matrix.name }}/stage/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: KHGWin-${{ matrix.name }}-zips
          path: build/${{ matrix.name }}/KHGWin-*.zip
          if-no-files-found: error

  lgpl-sources:
    name: LGPL sources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # git describe for the version in the zip name

      - name: Package
        run: desktop/scripts/package-lgpl-sources.sh

      - uses: actions/upload-artifact@v4
        with:
          name: KHGWin-lgpl-sources
          path: build/KHGWin-*-lgpl-sources.zip
          if-no-files-found: error

  # Pushing a tag v<x.y.z> publishes a draft GitHub release with the zips; it goes public only when
  # someone presses Publish on GitHub.
  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, lgpl-sources]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: KHGWin-*
          path: dist

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft \
            --title "KHGWin ${GITHUB_REF_NAME}" \
            --notes "Windows port of Star Trek: Klingon Honor Guard. Needs your own retail copy of the game; contains no game data. Unzip KHGWin-*-win64.zip anywhere and run KHGWin.exe (see KHGWin-README.txt). The -debug zips are for reading crash reports; the lgpl-sources zip holds the FFmpeg and OpenAL Soft sources of the shipped DLLs." \
            dist/*/KHGWin-*.zip

  android:
    name: Android debug APK
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Build
        run: ./gradlew --no-daemon :app:assembleDebug
