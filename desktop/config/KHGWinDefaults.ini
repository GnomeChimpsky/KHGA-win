; KHGWin.exe driver settings.
; On first run KHGWin.ini is created from your retail Default.ini (or Khg.ini) with only the keys
; below replaced, so gameplay, input and menu settings start exactly as your retail install has them.
; Window settings from [WinDrv.WindowsClient] are carried over to [NSDLDrv.NSDLClient].
; Delete KHGWin.ini to regenerate it. Your retail Khg.ini is never modified.

[Engine.Engine]
GameRenderDevice=VulkanDrv.VulkanRenderDevice
WindowedRenderDevice=VulkanDrv.VulkanRenderDevice
AudioDevice=NOpenALDrv.NOpenALAudioSubsystem
ViewportManager=NSDLDrv.NSDLClient
Render=Render.Render
